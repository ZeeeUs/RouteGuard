name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: routeguard/src/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Check generated mocks
        run: |
          make generate
          git diff --exit-code -- routeguard/src
          test -z "$(git ls-files --others --exclude-standard -- routeguard/src)"
      - name: Build the OpenWrt release verifier
        run: |
          sh scripts/build-usign.sh "$RUNNER_TEMP/routeguard-usign"
          echo "$RUNNER_TEMP/routeguard-usign/bin" >> "$GITHUB_PATH"
      - run: make check
      - name: Go race detector and coverage
        working-directory: routeguard/src
        run: |
          mkdir -p ../../build
          go test -race -coverprofile=../../build/coverage.out ./...

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: routeguard/src/go.mod
          cache: false
      - run: make integration TARGET_ARCH=amd64
      - run: make resources TARGET_ARCH=amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: integration-and-resources
          path: |
            build/*.json
            build/*.rss
