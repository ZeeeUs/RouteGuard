name: Release OpenWrt APKs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: targets
        run: echo "matrix=$(python3 scripts/release.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: routeguard/src/go.mod
          cache: false

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file gawk gettext libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip wget zlib1g-dev zstd

      - name: Build and check APKs
        env:
          ROUTEGUARD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          ROUTEGUARD_ARCH: ${{ matrix.architecture }}
          GOTOOLCHAIN: local
        run: sh scripts/build-sdk.sh "$RUNNER_TEMP/openwrt-sdk" "$RUNNER_TEMP/dist" "$ROUTEGUARD_TAG" "$ROUTEGUARD_ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openwrt-${{ matrix.architecture }}
          path: ${{ runner.temp }}/dist/*.apk
          if-no-files-found: error
          compression-level: 0

  bundle:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: openwrt-*
          merge-multiple: true
          path: dist
      - name: Verify complete release and generate checksums
        env:
          ROUTEGUARD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 scripts/check-package-size.py dist
          python3 scripts/release.py bundle dist --tag "$ROUTEGUARD_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openwrt-release
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openwrt-release
          path: dist

      - name: Build the OpenWrt release signer
        run: sh scripts/build-usign.sh "$RUNNER_TEMP/routeguard-usign"
      - name: Sign the checksum manifest and embed its public key
        env:
          ROUTEGUARD_SIGNING_KEY: ${{ secrets.ROUTEGUARD_SIGNING_KEY }}
        run: |
          test -n "$ROUTEGUARD_SIGNING_KEY" || { echo 'ROUTEGUARD_SIGNING_KEY is required' >&2; exit 1; }
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ROUTEGUARD_SIGNING_KEY" > "$key"
          usign="$RUNNER_TEMP/routeguard-usign/bin/usign"
          "$usign" -S -s "$key" -m dist/SHA256SUMS -x dist/SHA256SUMS.sig
          python3 scripts/release.py embed-key dist --signing-key "$key" --usign "$usign"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --latest \
            dist/install.sh dist/SHA256SUMS dist/SHA256SUMS.sig dist/*.apk
